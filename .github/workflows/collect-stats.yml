name: Collect OW stats

on:
  schedule:
    # Every 20 minutes. Cumulative stats (games played, etc.) only need one
    # snapshot per day — the collector script upserts data/history.json by
    # calendar date regardless of how often this runs. Rank is not
    # cumulative (it can go up and back down within a day), so it's tracked
    # separately in data/rank_history.json, appended only on an actual
    # change — this cadence is what lets that file catch same-day rank
    # swings instead of only ever seeing the last value before midnight.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/collect-snapshot.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/rank_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Stats snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
