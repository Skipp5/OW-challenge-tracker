name: Collect daily OW stats

on:
  schedule:
    # 08:00 UTC daily. Edit this if you want the snapshot taken at a
    # different point in your day (cron is always UTC).
    - cron: "0 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/collect-snapshot.mjs

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily stats snapshot: $(date -u +%F)"
            git push
          fi
